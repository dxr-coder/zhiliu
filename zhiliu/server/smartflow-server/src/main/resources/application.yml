# SmartFlow B1 配置
# 功能：数据源/JWT/端口；与 smartflow Python 共用 MySQL 库名 mianshi，表前缀 sf_。
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mianshi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-format: yyyy-MM-dd HH:mm:ss
    date-format: yyyy-MM-dd

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

smartflow:
  jwt:
    # 开发密钥；生产用环境变量注入
    secret: smartflow-dev-secret-key-must-be-32-bytes-min!!
    access-ttl-minutes: 720

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.smartflow: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
